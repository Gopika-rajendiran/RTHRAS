<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reception Display - Smart Hospital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-white font-sans overflow-hidden flex flex-col h-screen">
    
    <!-- Header -->
    <header class="bg-slate-800 p-6 flex justify-between items-center shadow-lg border-b border-slate-700">
        <div>
            <h1 class="text-4xl font-bold text-blue-400">Smart Hospital</h1>
            <p class="text-xl text-slate-400 mt-2">Public Information Display</p>
        </div>
        <div class="text-right">
            <p class="text-3xl font-mono text-white" id="clock">00:00:00</p>
            <p class="text-sm text-slate-400 mt-1">Updates every 10s</p>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6 p-6 overflow-hidden">
        
        <!-- Emergency Alert Area (Spans top) -->
        <section class="lg:col-span-3 bg-red-900/40 border border-red-500/50 rounded-2xl p-6 shadow-2xl flex items-center justify-between">
            <div class="flex items-center space-x-6">
                <div class="w-16 h-16 bg-red-500 rounded-full flex items-center justify-center animate-pulse shadow-lg shadow-red-500/50">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                </div>
                <div>
                    <h2 class="text-3xl font-bold text-red-400 tracking-wide">EMERGENCY STATUS</h2>
                    <div class="flex space-x-8 mt-2" id="emergency-container">
                        <!-- Dynamic emergency status -->
                        <span class="text-slate-300 italic text-xl">Loading...</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Doctors Area -->
        <section class="lg:col-span-2 bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700 flex flex-col h-full">
            <h2 class="text-2xl font-semibold text-blue-300 mb-6 border-b border-slate-700 pb-4">On-Duty Doctors</h2>
            <div class="flex-1 overflow-y-auto pr-2 space-y-4" id="doctors-container">
                <!-- Dynamic doctors -->
                <div class="text-slate-500 italic text-xl">Loading doctors...</div>
            </div>
        </section>

        <!-- Blood Stock Area -->
        <section class="bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700 flex flex-col h-full">
            <h2 class="text-2xl font-semibold text-red-300 mb-6 border-b border-slate-700 pb-4">Blood Bank</h2>
            <div class="flex-1 overflow-y-auto pr-2 grid grid-cols-2 gap-4" id="blood-container">
                <!-- Dynamic blood -->
                <div class="text-slate-500 italic text-xl col-span-2">Loading inventory...</div>
            </div>
        </section>

    </main>

    <script src="http://localhost:5000/socket.io/socket.io.js"></script>
    <script src="js/socketClient.js"></script>
    <script src="js/doctor.js"></script>
    <script src="js/blood.js"></script>
    <script src="js/emergency.js"></script>
    <script src="js/reception.js"></script>
</body>
</html>
