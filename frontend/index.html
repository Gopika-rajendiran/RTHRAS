<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Smart Hospital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800 flex h-screen overflow-hidden">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl hidden md:flex">
        <div class="p-6 border-b border-slate-800">
            <h2 class="text-2xl font-bold text-blue-400">Smart Hospital</h2>
            <p class="text-slate-400 text-sm mt-1">Admin Portal</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="block px-4 py-3 bg-blue-600 rounded-lg font-medium">Dashboard</a>
            <a href="reception.html" target="_blank" class="block px-4 py-3 hover:bg-slate-800 rounded-lg text-slate-300 transition">Reception View</a>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <button id="logout-btn" class="w-full px-4 py-2 bg-slate-800 hover:bg-red-600 rounded-lg text-left transition">Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <!-- Navbar -->
        <header class="bg-white shadow-sm px-8 py-5 flex justify-between items-center border-b border-slate-200">
            <h1 class="text-2xl font-semibold text-slate-800">Resource Overview</h1>
            <div class="flex items-center space-x-4">
                <span class="text-sm font-medium text-slate-500">Welcome, Admin</span>
            </div>
        </header>

        <!-- Dashboard Content -->
        <div class="p-8 space-y-8">
            
            <!-- Emergency Status Panel -->
            <section id="emergency-section" class="bg-red-50 border border-red-200 rounded-xl p-6 shadow-sm">
                <h3 class="text-lg font-bold text-red-800 mb-4 flex items-center">
                    <span class="w-3 h-3 bg-red-500 rounded-full mr-2 animate-pulse"></span>
                    Emergency Status
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="emergency-container">
                    <!-- Dynamic emergency info will render here -->
                    <div class="text-slate-500 italic">Loading emergency data...</div>
                </div>
            </section>

            <!-- Grid Layout for Doctors & Blood Stock -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <!-- Doctor Status Section -->
                <section class="lg:col-span-2 bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                    <h3 class="text-lg font-bold text-slate-800 mb-4">Doctor Availability</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="doctors-container">
                        <!-- Dynamic doctor cards will render here -->
                        <div class="text-slate-500 italic">Loading doctors data...</div>
                    </div>
                </section>

                <!-- Blood Stock Section -->
                <section class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                    <h3 class="text-lg font-bold text-slate-800 mb-4">Blood Inventory</h3>
                    <div class="space-y-4" id="blood-container">
                        <!-- Dynamic blood stock will render here -->
                        <div class="text-slate-500 italic">Loading blood stock...</div>
                    </div>
                </section>
                
            </div>
            
            <!-- Admin Control Panel -->
            <div class="mt-12 bg-slate-100 border border-slate-300 rounded-xl p-6 shadow-md">
                <h2 class="text-xl font-bold text-slate-800 mb-6">Admin Control Panel</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    
                    <!-- Emergency Form -->
                    <form id="emergency-form" class="bg-white p-4 rounded-lg shadow-sm border border-slate-200">
                        <h3 class="font-bold text-slate-700 mb-4">Update Emergency</h3>
                        <div class="mb-3">
                            <label class="block text-xs font-semibold text-slate-500 mb-1">ICU Status</label>
                            <select id="icu-status" class="w-full border rounded p-2 text-sm text-slate-700">
                                <option value="ICU Available">ICU Available</option>
                                <option value="ICU Full">ICU Full</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Trauma Status</label>
                            <select id="trauma-status" class="w-full border rounded p-2 text-sm text-slate-700">
                                <option value="Trauma Ready">Trauma Ready</option>
                                <option value="Trauma Busy">Trauma Busy</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white rounded p-2 text-sm font-bold hover:bg-blue-700 transition">Save Emergency Status</button>
                    </form>

                    <!-- Doctor Form -->
                    <form id="doctor-form" class="bg-white p-4 rounded-lg shadow-sm border border-slate-200">
                        <h3 class="font-bold text-slate-700 mb-4">Manage Doctor</h3>
                        <input type="hidden" id="doctor-id">
                        <div class="mb-3">
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Name</label>
                            <input type="text" id="doctor-name" class="w-full border rounded p-2 text-sm text-slate-700" placeholder="e.g. Dr. Smith" required>
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Department</label>
                            <input type="text" id="doctor-dept" class="w-full border rounded p-2 text-sm text-slate-700" placeholder="e.g. Cardiology" required>
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Status</label>
                            <select id="doctor-status" class="w-full border rounded p-2 text-sm text-slate-700" required>
                                <option value="Available">Available</option>
                                <option value="Busy">Busy</option>
                                <option value="Emergency">Emergency</option>
                                <option value="Offline">Offline</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Queue</label>
                            <input type="number" id="doctor-queue" class="w-full border rounded p-2 text-sm text-slate-700" value="0" min="0" required>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white rounded p-2 text-sm font-bold hover:bg-blue-700 transition">Save Doctor</button>
                    </form>

                    <!-- Blood Stock Form -->
                    <form id="blood-form" class="bg-white p-4 rounded-lg shadow-sm border border-slate-200">
                        <h3 class="font-bold text-slate-700 mb-4">Manage Blood Stock</h3>
                        <input type="hidden" id="blood-id">
                        <div class="mb-3">
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Blood Group</label>
                            <input type="text" id="blood-group" class="w-full border rounded p-2 text-sm text-slate-700" placeholder="e.g. A+" required>
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Status</label>
                            <select id="blood-status" class="w-full border rounded p-2 text-sm text-slate-700" required>
                                <option value="Available">Available</option>
                                <option value="Low">Low</option>
                                <option value="Critical">Critical</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Units</label>
                            <input type="number" id="blood-units" class="w-full border rounded p-2 text-sm text-slate-700" value="0" min="0" required>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white rounded p-2 text-sm font-bold hover:bg-blue-700 transition">Save Blood Stock</button>
                    </form>
                    
                </div>
            </div>
        </div>
    </main>

    <script src="http://localhost:5000/socket.io/socket.io.js"></script>
    <script src="js/socketClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/doctor.js"></script>
    <script src="js/blood.js"></script>
    <script src="js/emergency.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
